{% comment %}
  Links to the other research themes (sidebar on theme pages).
  Usage: {% include omni-other-themes.html current="brain-structure" %}
{% endcomment %}
<div class="omni-aside-card">
  <span class="omni-label">Other themes</span>
  {% for theme in site.data.themes %}
    {% unless theme.id == include.current %}
      <a href="{{ theme.link | relative_url | uri_escape }}">{{ theme.title }}</a>
    {% endunless %}
  {% endfor %}
</div>
